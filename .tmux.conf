# end prefix
#set-option -g prefix C-a
#unbind-key C-a
#bind-key C-a send-prefix

# Start window/pane numbering at 1 instead of 0
# (matches the physical layout of number keys: 1,2,3...0)
set -g base-index 1
setw -g pane-base-index 1

# auto-renumber windows after closing one to avoid gaps in indices
# set -g renumber-windows on

# Use Alt-arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Shift + Alt + arrow to swap windows
bind -n S-M-Left  swap-window -d -t -1
bind -n S-M-Right swap-window -d -t +1

# Set easier window split keys
bind-key h split-window -h
bind-key v split-window -v

# open new windows in the current path
bind C new-window -c "#{pane_current_path}"

# Mouse mode
set -g mouse on
#setw -g mode-mouse on
#set -g mouse-select-window on
#set -g mouse-select-pane on
#set -g mouse-resize-pane on
#set -g mouse-utf on

# set default terminal mode to 256 colors
# set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# statusbar
set -g status-style 'fg=colour0 bg=colour2'
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=30:pane_title}" %H:%M %Y-%m-%d'
set -g status-left-length 40

setw -g window-status-current-style 'fg=colour2 bg=colour134 bold'
setw -g window-status-current-format ' #I:#W#F '

setw -g window-status-style 'fg=colour16'
setw -g window-status-format ' #I:#W#F '

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'

# Image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message ".tmux.conf reloaded"
